<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OceanView · Invoice Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f2f1ed;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid #ddd;padding:0 2rem;height:52px;display:flex;align-items:center;gap:12px}
.logo{font-size:14px;font-weight:700;color:#111}
.logo-sub{font-size:12px;color:#aaa}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem}
.card{background:#fff;border-radius:16px;border:1px solid #e0ddd5;padding:2.5rem;width:100%;max-width:520px;text-align:center}
.card-title{font-size:20px;font-weight:700;color:#111;margin-bottom:6px}
.card-sub{font-size:13px;color:#888;margin-bottom:1.5rem;line-height:1.5}

/* API Key */
.api-section{background:#faf9f7;border:1px solid #e8e5de;border-radius:10px;padding:14px 16px;margin-bottom:1.5rem;text-align:left}
.api-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.api-label a{font-size:10px;color:#2d6a4f;text-decoration:none;font-weight:400;text-transform:none}
.api-label a:hover{text-decoration:underline}
.api-row{display:flex;gap:8px}
.api-input{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:monospace;background:#fff;color:#111;outline:none}
.api-input:focus{border-color:#2d6a4f;box-shadow:0 0 0 2px rgba(45,106,79,0.1)}
.api-input.ok{border-color:#2d6a4f}
.api-input.err{border-color:#c0392b}
.api-save{padding:9px 14px;background:#1a3a2a;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.api-save:hover{background:#0f2a1d}
.api-status{font-size:11px;margin-top:5px;color:#999}
.api-status.ok{color:#2d6a4f}
.api-status.err{color:#c0392b}

.upload-zone{border:2px dashed #d0cdc5;border-radius:12px;padding:2.5rem 1.5rem;cursor:pointer;transition:all 0.15s;background:#faf9f7;margin-bottom:1.5rem}
.upload-zone:hover,.upload-zone.drag{border-color:#888;background:#f0ede8}
.upload-zone.ready{border-color:#2d6a4f;background:#edf7f2;border-style:solid}
.upload-icon{font-size:38px;margin-bottom:10px}
.upload-main{font-size:14px;font-weight:600;color:#333;margin-bottom:4px}
.upload-hint{font-size:12px;color:#999}
#fileInput{display:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:#1a3a2a;color:#fff}
.btn-primary:hover{background:#0f2a1d}
.btn-primary:disabled{background:#bbb;cursor:not-allowed}
.btn-download{background:#2d6a4f;color:#fff;margin-top:0}
.btn-download:hover{background:#1a5a35}
.btn-reset{background:transparent;color:#666;border:1px solid #ddd;margin-top:8px;font-size:13px;padding:10px}
.btn-reset:hover{background:#f5f4f0}
.progress{margin-top:1.5rem;display:none}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:6px;background:#f5f4f0;color:#888}
.step.active{background:#e8f5ee;color:#1a5a35;font-weight:600}
.step.done{background:#f0faf4;color:#2d6a4f}
.step.err{background:#fdecea;color:#8a1a1a}
.step-ic{width:20px;text-align:center;font-size:15px}
.result{margin-top:1.5rem;display:none;text-align:left}
.result-header{font-size:12px;font-weight:700;color:#2d6a4f;margin-bottom:10px;text-align:center}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:1rem}
.chip{background:#f5f4f0;border-radius:6px;padding:8px 10px}
.chip.wide{grid-column:1/-1}
.chip .lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:0.04em}
.chip .val{font-size:13px;font-weight:700;color:#111;margin-top:1px}
.chip .val.total{color:#1a5a35;font-size:15px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
.spinner-dark{border-color:rgba(45,106,79,0.3);border-top-color:#2d6a4f}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <span class="logo">Hotel OceanView</span>
  <span class="logo-sub">Invoice Generator</span>
</header>
<main>
  <div class="card">
    <div class="card-title">Bill → Invoice</div>
    <div class="card-sub">Bill PDF 업로드 한 번으로<br>Invoice PDF가 자동 완성됩니다</div>

    <div class="api-section">
      <div class="api-label">
        Anthropic API Key
        <a href="https://console.anthropic.com/settings/keys" target="_blank">키 발급 →</a>
      </div>
      <div class="api-row">
        <input type="password" class="api-input" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
        <button class="api-save" onclick="saveKey()">저장</button>
      </div>
      <div class="api-status" id="apiStatus">API 키를 입력하면 브라우저에 안전하게 저장됩니다</div>
    </div>

    <div class="upload-zone" id="zone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon" id="zoneIcon">📋</div>
      <div class="upload-main" id="zoneMain">Bill PDF를 클릭하거나 드래그</div>
      <div class="upload-hint" id="zoneHint">Hotel OceanView Bill 파일</div>
    </div>
    <input type="file" id="fileInput" accept=".pdf">

    <button class="btn btn-primary" id="runBtn" onclick="run()" disabled>
      <span id="btnIc">⚡</span><span id="btnTxt">Invoice 자동 생성</span>
    </button>

    <div class="progress" id="prog">
      <div class="step" id="s1"><span class="step-ic">📤</span>PDF 읽는 중...</div>
      <div class="step" id="s2"><span class="step-ic">🤖</span>AI가 내용 분석 중...</div>
      <div class="step" id="s3"><span class="step-ic">📄</span>Invoice PDF 생성 중...</div>
    </div>

    <div class="result" id="result">
      <div class="result-header">✅ Invoice 생성 완료</div>
      <div class="chips" id="chips"></div>
      <button class="btn btn-download" id="dlBtn">📥 Invoice PDF 다운로드</button>
      <button class="btn btn-reset" onclick="reset()">다른 파일 처리하기</button>
    </div>
  </div>
</main>

<script>
let file = null, pdfBytes = null, filename = '';

// ── API Key 관리 ─────────────────────────────────────────
(function initKey() {
  const k = localStorage.getItem('ov_api_key') || '';
  if (k) {
    document.getElementById('apiKey').value = k;
    document.getElementById('apiKey').classList.add('ok');
    document.getElementById('apiStatus').textContent = '저장된 키 사용 중';
    document.getElementById('apiStatus').className = 'api-status ok';
  }
})();

function saveKey() {
  const v = document.getElementById('apiKey').value.trim();
  if (!v.startsWith('sk-ant-')) {
    document.getElementById('apiKey').classList.remove('ok');
    document.getElementById('apiKey').classList.add('err');
    document.getElementById('apiStatus').textContent = '올바른 Anthropic API 키를 입력해주세요 (sk-ant-로 시작)';
    document.getElementById('apiStatus').className = 'api-status err';
    return;
  }
  localStorage.setItem('ov_api_key', v);
  document.getElementById('apiKey').classList.remove('err');
  document.getElementById('apiKey').classList.add('ok');
  document.getElementById('apiStatus').textContent = '✓ 저장 완료';
  document.getElementById('apiStatus').className = 'api-status ok';
}

// ── 파일 업로드 ──────────────────────────────────────────
const zone = document.getElementById('zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f?.type === 'application/pdf') setFile(f);
});
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});

function setFile(f) {
  file = f;
  zone.classList.add('ready');
  document.getElementById('zoneIcon').textContent = '✅';
  document.getElementById('zoneMain').textContent = f.name;
  document.getElementById('zoneHint').textContent = (f.size/1024).toFixed(0) + ' KB';
  document.getElementById('runBtn').disabled = false;
  document.getElementById('prog').style.display = 'none';
  document.getElementById('result').style.display = 'none';
}

function step(id, state, msg) {
  const el = document.getElementById(id);
  el.className = 'step ' + state;
  const ic = state==='active' ? '<span class="spinner spinner-dark"></span>'
           : state==='done'   ? '✅' : '❌';
  el.innerHTML = `<span class="step-ic">${ic}</span>${msg}`;
}

function nextInvNo() {
  const t = new Date();
  const p = 'INV-' + t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') + '-';
  const k = 'inv_' + p;
  const n = (parseInt(localStorage.getItem(k)||'0') + 1);
  localStorage.setItem(k, n);
  return p + String(n).padStart(3,'0');
}

async function run() {
  const apiKey = localStorage.getItem('ov_api_key') || document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    alert('Anthropic API 키를 먼저 입력하고 저장해주세요.');
    return;
  }
  if (!file) return;

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span><span>처리 중...</span>';
  document.getElementById('prog').style.display = 'block';
  document.getElementById('result').style.display = 'none';

  try {
    step('s1', 'active', 'PDF 읽는 중...');
    const ab = await file.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(ab)));
    step('s1', 'done', 'PDF 읽기 완료');

    step('s2', 'active', 'AI가 내용 분석 중...');
    const data = await callClaude(b64, apiKey);
    step('s2', 'done', '데이터 추출 완료');

    step('s3', 'active', 'Invoice PDF 생성 중...');
    const invNo = nextInvNo();
    const invDate = new Date().toISOString().split('T')[0];
    pdfBytes = buildPDF(data, invNo, invDate);
    filename = `Invoice_${(data.vessel||'OceanView').replace(/\s+/g,'_')}_${invDate}.pdf`;
    step('s3', 'done', 'Invoice PDF 생성 완료');

    showResult(data, invNo, invDate);
  } catch(err) {
    ['s1','s2','s3'].forEach(id => {
      if (document.getElementById(id).classList.contains('active')) step(id, 'err', '오류: ' + err.message);
    });
    btn.disabled = false;
    btn.innerHTML = '<span>⚡</span><span>Invoice 자동 생성</span>';
  }
}

async function callClaude(b64, apiKey) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      messages: [{role: 'user', content: [
        {type: 'document', source: {type: 'base64', media_type: 'application/pdf', data: b64}},
        {type: 'text', text: `This is a Hotel OceanView bill PDF. Extract all information and return ONLY valid JSON (no markdown, no explanation).

The bill columns are: DATE, ROOM, RESTAURANT(LUNCH), RESTAURANT(DINNER), CAFÉ, LAUNDRY, OTHER, TOTAL, BALANCE
Also extract: Company name, Vessel/Ship name, Room No, Guest Name, Entry/Check-in date.

Rules:
- Include only charges with non-zero amounts in "charges" array
- Room charge description: "Room X nights" (X = number of nights from dates)
- Food charges: use exact label like "Lunch", "Dinner", "Café"
- Other charges: "Laundry", "Other" etc.
- check_in = entry date (first date in bill), check_out = check_in + nights
- Amounts as integers (Korean Won)
- Dates as YYYY-MM-DD

Return this JSON structure only:
{
  "company": "BAYSTAR SHIPPING",
  "vessel": "CONDOR",
  "guest_name": "유덕열",
  "room_no": "604",
  "check_in": "2026-06-10",
  "check_out": "2026-06-11",
  "charges": [
    {"description": "Room 1 nights", "amount": 90000},
    {"description": "Dinner", "amount": 30000}
  ],
  "total": 120000
}`}
      ]}]
    })
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }

  const j = await resp.json();
  if (j.error) throw new Error(j.error.message);
  const raw = j.content.map(c => c.text||'').join('').replace(/```json|```/g, '').trim();
  return JSON.parse(raw);
}

function showResult(data, invNo, invDate) {
  const fmt = n => Number(n).toLocaleString('ko-KR');
  const chargesHtml = (data.charges||[]).map(c =>
    `<div class="chip wide"><div class="lbl">${c.description}</div><div class="val">KRW ${fmt(c.amount)}</div></div>`
  ).join('');

  document.getElementById('chips').innerHTML =
    [['Invoice No.', invNo], ['Date', invDate],
     ['Company', data.company||'-'], ['Vessel', data.vessel||'-'],
     ['Guest', data.guest_name||'-'], ['Room', data.room_no||'-'],
     ['Check-in', data.check_in||'-'], ['Check-out', data.check_out||'-']]
    .map(([l,v]) => `<div class="chip"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')
    + chargesHtml
    + `<div class="chip wide"><div class="lbl">Total</div><div class="val total">KRW ${fmt(data.total||0)}</div></div>`;

  document.getElementById('dlBtn').onclick = downloadPDF;
  document.getElementById('result').style.display = 'block';
  document.getElementById('prog').style.display = 'none';
  const btn = document.getElementById('runBtn');
  btn.disabled = false;
  btn.innerHTML = '<span>⚡</span><span>Invoice 자동 생성</span>';
}

function downloadPDF() {
  if (!pdfBytes) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([pdfBytes], {type: 'application/pdf'}));
  a.download = filename; a.click();
}

function reset() {
  file = null; pdfBytes = null;
  zone.classList.remove('ready');
  document.getElementById('zoneIcon').textContent = '📋';
  document.getElementById('zoneMain').textContent = 'Bill PDF를 클릭하거나 드래그';
  document.getElementById('zoneHint').textContent = 'Hotel OceanView Bill 파일';
  document.getElementById('fileInput').value = '';
  document.getElementById('runBtn').disabled = true;
  document.getElementById('prog').style.display = 'none';
  document.getElementById('result').style.display = 'none';
}

// ── PDF Builder ───────────────────────────────────────────────────────────────
function buildPDF(data, invNo, invDate) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const PW=210, ML=20, MR=20, CW=170;
  const fmt = n => Number(n).toLocaleString('ko-KR');

  function hr(y, lw=0.3, r=180, g=180, b=180) {
    doc.setDrawColor(r,g,b); doc.setLineWidth(lw);
    doc.line(ML, y, PW-MR, y);
  }

  // ── HEADER ──────────────────────────────────────────────
  doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  doc.text('HOTEL ADRESS', ML, 13);
  doc.setFontSize(7);
  doc.text('50, Haesuyokjang 1-gil, Dong-gu, Ulsan 44057 Korea', ML, 17.5);

  doc.setFontSize(17); doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
  doc.text('Hotel', 105, 12, {align:'center'});
  doc.text('OceanView', 105, 20, {align:'center'});
  doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  doc.text('ULSAN, KOREA', 105, 25, {align:'center'});

  doc.setFontSize(7.5); doc.setTextColor(80,80,80);
  doc.text('HOTEL CONTACT', PW-MR, 13, {align:'right'});
  doc.setFontSize(7);
  doc.text('+82 .52. 235 . 7777', PW-MR, 17.5, {align:'right'});
  doc.text('hotelov@hanmail.net', PW-MR, 22, {align:'right'});

  hr(29, 0.5, 160, 160, 160);

  // ── INVOICE NO / DATE ────────────────────────────────────
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(80,80,80);
  doc.text(`Invoice No: ${invNo}`, PW-MR, 36, {align:'right'});
  doc.text(`Date: ${invDate}`, PW-MR, 41, {align:'right'});

  // ── COMPANY / VESSEL ────────────────────────────────────
  let y = 38;
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
  doc.text('Company', 100, y, {align:'right'});
  doc.text(data.company||'', 110, y, {align:'left'});
  y += 9;
  doc.text('Vessel Name', 100, y, {align:'right'});
  doc.text(data.vessel||'', 110, y, {align:'left'});

  // ── TABLE ───────────────────────────────────────────────
  y += 11;
  const RH = 8;
  const c1=ML, c2=ML+28, c3=ML+48, c4=ML+88, c5=ML+140, c6=ML+162, cEnd=PW-MR;

  function vdivs(top, bottom) {
    doc.setDrawColor(180,180,180); doc.setLineWidth(0.3);
    [c2,c3,c4,c5,c6].forEach(x => doc.line(x, top, x, bottom));
  }

  // Header row
  doc.setFillColor(225,225,225);
  doc.rect(ML, y, CW, RH, 'F');
  doc.setDrawColor(160,160,160); doc.setLineWidth(0.4);
  doc.rect(ML, y, CW, RH, 'S');
  vdivs(y, y+RH);

  doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
  doc.text('DATE',        (c1+c2)/2,   y+5,   {align:'center'});
  doc.text('Room',        (c2+c3)/2,   y+3.5, {align:'center'});
  doc.text('No.',         (c2+c3)/2,   y+7,   {align:'center'});
  doc.text('Name',        (c3+c4)/2,   y+5,   {align:'center'});
  doc.text('DESCRIPTION', (c4+c5)/2,   y+5,   {align:'center'});
  doc.text('AMOUNT',      (c5+c6)/2,   y+5,   {align:'center'});
  doc.text('TOTAL',       (c6+cEnd)/2, y+5,   {align:'center'});
  y += RH;

  // Data rows
  const charges = data.charges || [];
  const ci = data.check_in||'', co = data.check_out||'';
  const rn = String(data.room_no||''), gn = data.guest_name||'';
  let running = 0;
  const mid = Math.ceil(charges.length / 2) - 1;

  charges.forEach((ch, i) => {
    const amt = parseInt(ch.amount) || 0;
    running += amt;

    doc.setDrawColor(190,190,190); doc.setLineWidth(0.3);
    doc.rect(ML, y, CW, RH, 'S');
    vdivs(y, y+RH);

    doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);

    // DATE column: first = check_in, middle = ~, last = check_out
    if (charges.length === 1) {
      doc.text(ci, (c1+c2)/2, y+5, {align:'center'});
    } else if (i === 0) {
      doc.text(ci, (c1+c2)/2, y+5, {align:'center'});
    } else if (i === mid) {
      doc.text('~', (c1+c2)/2, y+5, {align:'center'});
    } else if (i === charges.length - 1) {
      doc.text(co, (c1+c2)/2, y+5, {align:'center'});
    }

    // Room No / Name — first row only
    if (i === 0) {
      doc.text(rn, (c2+c3)/2, y+5, {align:'center'});
      doc.text(gn, (c3+c4)/2, y+5, {align:'center'});
    }

    // Description
    doc.text(ch.description||'', c4+3, y+5);

    // AMOUNT col — each item
    if (amt > 0) {
      doc.text(fmt(amt), c6-2, y+5, {align:'right'});
    }

    // TOTAL col — running total
    if (amt > 0) {
      doc.text(fmt(running), cEnd-2, y+5, {align:'right'});
    }

    y += RH;
  });

  // Total row
  doc.setFillColor(220,220,220);
  doc.rect(ML, y, CW, RH, 'F');
  doc.setDrawColor(120,120,120); doc.setLineWidth(0.5);
  doc.rect(ML, y, CW, RH, 'S');
  doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(20,20,20);
  doc.text('Total.', 105, y+5.5, {align:'center'});
  doc.text(fmt(data.total||running), cEnd-2, y+5.5, {align:'right'});
  y += RH + 9;

  doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(60,60,60);
  doc.text('Thank you.', 105, y, {align:'center'});

  return doc.output('arraybuffer');
}
</script>
</body>
</html>
